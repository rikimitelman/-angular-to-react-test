<nav class="navbar">
  <div class="navbar-brand">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="3" y="3" width="7" height="7" rx="1" fill="currentColor" opacity="0.9"/>
      <rect x="14" y="3" width="7" height="7" rx="1" fill="currentColor" opacity="0.6"/>
      <rect x="3" y="14" width="7" height="7" rx="1" fill="currentColor" opacity="0.6"/>
      <rect x="14" y="14" width="7" height="7" rx="1" fill="currentColor" opacity="0.3"/>
    </svg>
    <span class="brand-name">ProjectHub</span>
  </div>

  <div class="navbar-links">
    <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7"/>
        <rect x="14" y="3" width="7" height="7"/>
        <rect x="3" y="14" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/>
      </svg>
      Dashboard
    </a>

    <a routerLink="/board" routerLinkActive="active" class="nav-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="5" height="18" rx="1"/>
        <rect x="10" y="3" width="5" height="12" rx="1"/>
        <rect x="17" y="3" width="5" height="15" rx="1"/>
      </svg>
      Board
      @if (inProgressCount() > 0) {
        <span class="badge">{{ inProgressCount() }}</span>
      }
    </a>

    <a routerLink="/tasks" routerLinkActive="active" class="nav-link">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="8" y1="6" x2="21" y2="6"/>
        <line x1="8" y1="12" x2="21" y2="12"/>
        <line x1="8" y1="18" x2="21" y2="18"/>
        <line x1="3" y1="6" x2="3.01" y2="6"/>
        <line x1="3" y1="12" x2="3.01" y2="12"/>
        <line x1="3" y1="18" x2="3.01" y2="18"/>
      </svg>
      Tasks
    </a>
  </div>

  <div class="navbar-right">
    <div class="stat-chip">
      <span class="stat-dot done"></span>
      {{ stats().completionRate }}% done
    </div>
    @if (stats().overdue > 0) {
      <div class="stat-chip overdue">
        <span class="stat-dot overdue-dot"></span>
        {{ stats().overdue }} overdue
      </div>
    }
  </div>
</nav>
